{% extends "base.html" %} {% block title %}User reports{% endblock %} {% block content
    %}
    <h1 align="center">Diagnostic Results</h1>
    Name: {{ user.first_name }}<br>
    <table class="table table-striped table-hover">
    <thead>
      <th scope="col">#</th>
      <th scope="col">date</th>
      <th scope="col">Result</th>
    </thead>
      <tbody>
        {% for data in user.results %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{data.date}}</td>
            <td>{{data.result}}</td>
        </tr>
        {% endfor %}
      </tbody>
      
      </table>
    {% endblock %}
