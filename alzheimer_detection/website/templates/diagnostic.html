{% extends "base.html" %} {% block title %}Diagnostics{% endblock %} {% block content
    %}
    <h1 align="center">Get Diagnostics</h1>
    <form method="POST" action = "/diagnostic" method = "post" enctype="multipart/form-data">
        <label>Your Image File
            <input type="file" name="myImage" id='myImage' class="form-control" accept="image/png, image/jpeg" />
          </label>
      <br />
      <div align="center">
        <button type="submit" class="btn btn-primary">Get Result</button>
      </div>
    </form> 
    {% if result is not none %}
                <div class="result">
                    You are diagnosed with {{result}}...
                </div>
            {% endif %}
        </div>
    {% endblock %}
